<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>서울의새 8주년 도감전</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&family=Noto+Sans+KR:wght@300;400;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f5f7fa;
      font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 32px 20px 48px;
    }

    .card {
      background: #ffffff;
      border-radius: 28px;
      width: 100%;
      max-width: 420px;
      padding: 52px 32px 44px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 4px 32px rgba(0, 0, 0, 0.07);
    }

    .bird-wrap {
      width: 55%;
      max-width: 220px;
      margin-bottom: 36px;
    }

    .bird-wrap img {
      width: 100%;
      height: auto;
      display: block;
    }

    .eyebrow {
      font-size: 12px;
      font-weight: 300;
      letter-spacing: 0.15em;
      color: #8a9bb0;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .title {
      font-family: 'Noto Serif KR', serif;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.65;
      text-align: center;
      color: #1a1a2e;
      margin-bottom: 36px;
    }

    .divider {
      width: 40px;
      height: 1px;
      background: #d0dce8;
      margin-bottom: 28px;
    }

    .info {
      text-align: center;
      color: #4a5568;
      margin-bottom: 44px;
    }

    .info-date {
      font-size: 16px;
      font-weight: 700;
      color: #1a1a2e;
      letter-spacing: 0.03em;
      margin-bottom: 10px;
    }

    .info-place {
      font-size: 13px;
      font-weight: 300;
      line-height: 1.7;
      color: #5a6a7e;
      margin-bottom: 10px;
    }

    .info-time {
      font-size: 13px;
      font-weight: 400;
      color: #7a8a9e;
      letter-spacing: 0.05em;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .btn {
      background: #d6eaf8;
      color: #1a4d6e;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      text-align: center;
      padding: 15px 20px;
      border-radius: 50px;
      display: block;
      letter-spacing: 0.05em;
      transition: background 0.2s, transform 0.1s;
    }

    .btn:active {
      background: #b8d9f0;
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="card">

    <div class="bird-wrap">
      <img src="img/왜가리.gif" alt="서울의새">
    </div>

    <p class="eyebrow">Bird Seoul · 8th Anniversary</p>

    <p class="title">
      서울의새 8주년 도감전<br>«활짝 펼쳐 보다»<br>에 여러분을 초대합니다.
    </p>

    <div class="divider"></div>

    <div class="info">
      <p class="info-date">2026.06.27 — 06.28</p>
      <p class="info-place">서울 마포구 와우산로35길 9-11<br>지하1층 B01호 메가지그재그</p>
      <p class="info-time">10:00 – 18:00</p>
    </div>

    <div class="buttons">
      <a class="btn" href="#" target="_blank">찾아오시는 길</a>
      <a class="btn" href="#" target="_blank">인스타그램</a>
      <a class="btn" href="#" target="_blank">워크숍</a>
    </div>

  </div>

</body>
</html>
